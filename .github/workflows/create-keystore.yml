name: Create Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p output
          keytool -genkeypair \
            -keystore output/routinebridge-release.jks \
            -storetype PKCS12 \
            -alias routinebridge \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=RoutineBridge, O=RoutineBridge, C=DE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD"

      - name: Upload permanent keystore
        uses: actions/upload-artifact@v4
        with:
          name: routinebridge-keystore
          path: output/routinebridge-release.jks
          retention-days: 1
