name: Android Build

on:
  push:
    branches:
      - main
      - experiment/root-worker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/routinebridge-release.jks"
          test -s "$RUNNER_TEMP/routinebridge-release.jks"

      - name: Run experimental unit tests
        run: ./gradlew testExperimentalUnitTest

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/routinebridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleExperimental
          fi

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: RoutineBridge-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Experimental APK
        if: github.ref == 'refs/heads/experiment/root-worker'
        uses: actions/upload-artifact@v7
        with:
          name: RoutineBridge-experimental
          path: app/build/outputs/apk/experimental/app-experimental.apk
          if-no-files-found: error
